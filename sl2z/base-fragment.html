<div id="sl2z-upper-half-plane">
  <h3>上半平面的模群铺砌</h3>
  <div class="viz-controls">
    <label class="form-label" for="sl2z-depth">展开深度 <span id="sl2z-depth-value" class="tabular-nums">16</span>
      <input id="sl2z-depth" class="form-range" type="range" min="0" max="18" step="1" value="16">
    </label>
    <span class="text-small" id="sl2z-count"></span>
  </div>
  <div class="sl2z-plot"></div>
  <div class="viz-controls">
    <button type="button" class="btn" data-generator="S" data-tooltip="S：z ↦ −1/z">施加 S</button>
    <button type="button" class="btn" data-generator="T" data-tooltip="T：z ↦ z + 1">施加 T</button>
    <button type="button" class="btn" data-generator="Ti" data-tooltip="T⁻¹：z ↦ z − 1">施加 T⁻¹</button>
    <button type="button" class="btn btn-ghost" id="sl2z-in" aria-label="放大当前区域">放大</button>
    <button type="button" class="btn btn-ghost" id="sl2z-out" aria-label="缩小视野">缩小</button>
  </div>
  <div class="sl2z-legend text-small">
    <span><i class="sl2z-swatch standard"></i>标准基本域 ℱ</span>
    <span><i class="sl2z-swatch selected"></i>选中区域 gℱ</span>
    <span>点选 · 拖动 · 双指缩放</span>
  </div>
  <div id="sl2z-selected" class="text-small tabular-nums" aria-live="polite"></div>
</div>
<style>
  #sl2z-upper-half-plane { color:var(--foreground); width:100%; }
  #sl2z-upper-half-plane .sl2z-plot { width:100%; margin:8px 0; }
  #sl2z-upper-half-plane .sl2z-diagram { display:block; width:100%; touch-action:none; overflow:visible; }
  #sl2z-upper-half-plane .sl2z-diagram text { fill:var(--foreground); font-size:12px; font-weight:400; }
  #sl2z-upper-half-plane .sl2z-legend { display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 8px; }
  #sl2z-upper-half-plane .sl2z-legend span { display:inline-flex; align-items:center; gap:6px; }
  #sl2z-upper-half-plane .sl2z-swatch { display:inline-block; width:12px; height:12px; }
  #sl2z-upper-half-plane .sl2z-swatch.standard { background:var(--viz-series-2); opacity:.65; }
  #sl2z-upper-half-plane .sl2z-swatch.selected { background:var(--viz-series-1); opacity:.65; }
  #sl2z-upper-half-plane #sl2z-selected { overflow-wrap:anywhere; min-height:1.5em; }
  #sl2z-upper-half-plane .sl2z-frame { fill:none; stroke:var(--border); stroke-width:1; }
  #sl2z-upper-half-plane .sl2z-structure { fill:none; stroke:var(--foreground); stroke-opacity:.38; stroke-width:.65; }
  #sl2z-upper-half-plane .sl2z-fills { fill:var(--viz-series-1); fill-opacity:.065; stroke:none; }
  #sl2z-upper-half-plane .sl2z-standard { fill:var(--viz-series-2); fill-opacity:.13; stroke:var(--viz-series-2); stroke-width:1.5; }
  #sl2z-upper-half-plane .sl2z-selection { fill:var(--viz-series-1); fill-opacity:.19; stroke:var(--viz-series-1); stroke-width:2; }
  #sl2z-upper-half-plane .sl2z-vertex { fill:var(--viz-series-1); fill-opacity:.6; }
  #sl2z-upper-half-plane .sl2z-tick { stroke:var(--foreground); stroke-opacity:.55; stroke-width:.8; }
  #sl2z-upper-half-plane .sl2z-point { fill:var(--viz-series-1); stroke:var(--background); stroke-width:1.6; }
  #sl2z-upper-half-plane .sl2z-grid { stroke:var(--border); stroke-width:.65; stroke-opacity:.45; }
</style>
<script>
(() => {
  const root = document.getElementById("sl2z-upper-half-plane");
  const host = root.querySelector(".sl2z-plot");
  const slider = root.querySelector("#sl2z-depth");
  const depthLabel = root.querySelector("#sl2z-depth-value");
  const selectionLabel = root.querySelector("#sl2z-selected");
  const countLabel = root.querySelector("#sl2z-count");
  const NS = "http://www.w3.org/2000/svg";
  const I = [1,0,0,1], S = [0,-1,1,0], T = [1,1,0,1], Ti = [1,-1,0,1];
  const rhoL = [-.5,Math.sqrt(3)/2], rhoR = [.5,Math.sqrt(3)/2];
  const same = (g,h) => g.every((n,i) => n === h[i]);
  const key = g => g.join(",");
  function canon(g) {
    if (g[2] < 0 || (g[2] === 0 && g[3] < 0)) return g.map(n => n === 0 ? 0 : -n);
    return g.map(n => n === 0 ? 0 : n);
  }
  function mul(g,h) {
    const [a,b,c,d] = g, [e,f,k,l] = h;
    return canon([a*e+b*k,a*f+b*l,c*e+d*k,c*f+d*l]);
  }
  const inv = g => canon([g[3],-g[1],-g[2],g[0]]);
  function act(g,z) {
    const [a,b,c,d] = g, [x,y] = z;
    const den = (c*x+d)**2+(c*y)**2;
    return [((a*x+b)*(c*x+d)+a*c*y*y)/den,y/den];
  }
  function reduce(z) {
    let h = I.slice(), w = z.slice();
    for (let j=0;j<90;j++) {
      const n = Math.floor(w[0]+.5);
      if (n) {w[0] -= n; h = mul([1,-n,0,1],h);}
      if (w[0]**2+w[1]**2 >= 1-1e-11) return inv(h);
      const d = w[0]**2+w[1]**2;
      w = [-w[0]/d,w[1]/d]; h = mul(S,h);
    }
    return I.slice();
  }
  function circle(p,q) {
    if (Math.abs(p[0]-q[0]) < 1e-12) return null;
    const center = (p[0]**2+p[1]**2-q[0]**2-q[1]**2)/(2*(p[0]-q[0]));
    const r = Math.hypot(p[0]-center,p[1]);
    return {r:r,t1:Math.atan2(Math.max(0,p[1]),p[0]-center),
      t2:Math.atan2(Math.max(0,q[1]),q[0]-center)};
  }
  function geometry(g) {
    const p=act(g,rhoL), q=act(g,rhoR);
    if (g[2]===0) return {p,q,cusp:null,xmin:Math.min(p[0],q[0]),xmax:Math.max(p[0],q[0]),ymax:Infinity};
    const v=[g[0]/g[2],0];
    let ymax=Math.max(p[1],q[1]);
    for (const [a,b] of [[v,q],[q,p],[p,v]]) {
      const cc=circle(a,b);
      if (cc && Math.min(cc.t1,cc.t2)<=Math.PI/2 && Math.PI/2<=Math.max(cc.t1,cc.t2)) ymax=Math.max(ymax,cc.r);
    }
    return {p,q,cusp:v,xmin:Math.min(p[0],q[0],v[0]),xmax:Math.max(p[0],q[0],v[0]),ymax};
  }
  const tiles=[{g:I,depth:0}], lookup=new Map([[key(I),tiles[0]]]);
  for (let i=0;i<tiles.length;i++) {
    const tile=tiles[i];
    if (tile.depth===18) continue;
    for (const gen of [S,T,Ti]) {
      const g=mul(tile.g,gen), k=key(g);
      if (!lookup.has(k)) {
        const next={g,depth:tile.depth+1};
        tiles.push(next);lookup.set(k,next);
      }
    }
  }
  const camera={center:0,span:host.clientWidth<480?3.1:5.4,ymin:0};
  let selected=I.slice(), width=0,height=0,scale=1,px=64,py=16,pw=1,ph=1,xmin=0,ymax=1;
  let queued=false, depth=16;
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("class","sl2z-diagram cursor-interaction");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","SL(2,Z) 在上半平面上的有限深度基本域铺砌。可点选区域并施加 S、T 或 T 的逆。");
  host.append(svg);
  const f = n => Number(n.toFixed(5));
  const X = x => px+(x-xmin)*scale;
  const Y = y => py+ph-(y-camera.ymin)*scale;
  const point = p => f(X(p[0]))+","+f(Y(p[1]));
  function arc(p,q) {
    const cc=circle(p,q);
    if (!cc) return "L"+point(q);
    const r=f(cc.r*scale);
    return "A"+r+","+r+" 0 0 "+(cc.t1>cc.t2?1:0)+" "+point(q);
  }
  function path(geo) {
    const p=geo.p,q=geo.q,v=geo.cusp;
    if (!v) {
      const top=ymax+camera.span;
      return "M"+point(p)+"L"+point([p[0],top])+"L"+point([q[0],top])+"L"+point(q)+arc(q,p)+"Z";
    }
    return "M"+point(v)+arc(v,q)+arc(q,p)+arc(p,v)+"Z";
  }
  function visible(geo) {
    return geo.xmax>=xmin && geo.xmin<=xmin+camera.span && geo.ymax>=camera.ymin &&
      (!geo.cusp || (geo.xmax-geo.xmin)*scale>.32 && geo.ymax*scale>.32);
  }
  function short(g) {
    if (same(g,I)) return "ℱ";
    if (same(g,S)) return "Sℱ";
    if (g[2]===0) {
      if (g[1]===1) return "Tℱ";
      if (g[1]===-1) return "T⁻¹ℱ";
      return "T^"+g[1]+"ℱ";
    }
    return "gℱ";
  }
  function details() {
    const [a,b,c,d]=selected;
    const cusp=c===0?"∞":(c===1?String(a):a+"/"+c);
    const tile=lookup.get(key(selected));
    selectionLabel.textContent=short(selected)+" · g = ["+a+"  "+b+"; "+c+"  "+d+"] · 尖点 "+cusp+
      (tile?" · 字长 "+tile.depth:"");
    const moved=!same(selected,I);
    root.querySelector(".sl2z-swatch.selected").parentElement.hidden=!moved;
  }
  function draw() {
    width=Math.max(280,host.clientWidth);
    height=width<480?250:Math.min(420,width*.47+16);
    pw=width-80;ph=height-64;
    scale=pw/camera.span;xmin=camera.center-camera.span/2;ymax=camera.ymin+ph/scale;
    svg.setAttribute("viewBox","0 0 "+width+" "+height);
    svg.setAttribute("width",width);svg.setAttribute("height",height);
    let shapes="",lines="",stars="",labels="",ticks="";
    const seenVertices=new Set();
    let count=0,total=0;
    for (const tile of tiles) {
      if (tile.depth>depth) break;
      total++;
      const geo=tile.geo||(tile.geo=geometry(tile.g));
      if (!visible(geo)) continue;
      const d=path(geo);
      shapes+='<path d="'+d+'"/>';
      lines+='<path d="'+d+'"/>';
      count++;
      for (const p of [geo.p,geo.q]) {
        if (p[1]<Math.max(.018,camera.ymin) || p[1]>ymax || p[0]<xmin || p[0]>xmin+camera.span) continue;
        const k=p.map(x=>x.toFixed(7)).join(",");
        if (seenVertices.has(k)) continue;
        seenVertices.add(k);
        const r=p[1]*scale>20?1.8:1;
        stars+='<circle class="sl2z-vertex" cx="'+f(X(p[0]))+'" cy="'+f(Y(p[1]))+'" r="'+r+'"/>';
      }
    }
    const standard=path(geometry(I));
    const selGeo=geometry(selected), selectedPath=path(selGeo);
    const top=Math.max(1.3, camera.ymin+.7*(ymax-camera.ymin));
    for (let n=Math.ceil(xmin);n<=Math.floor(xmin+camera.span);n++) {
      if (X(n)<px+20 || X(n)>px+pw-20 || top<1.1 || Math.abs(n)>depth) continue;
      const lab=n===0?"ℱ":n===1?"Tℱ":n===-1?"T⁻¹ℱ":"T^"+n+"ℱ";
      labels+='<text x="'+f(X(n))+'" y="'+f(Y(top))+'" text-anchor="middle">'+lab+'</text>';
    }
    const sx=act(selected,[0,1.7]);
    if (!same(selected,I) && X(sx[0])>px+8 && X(sx[0])<px+pw-8 && Y(sx[1])>py+8 && Y(sx[1])<py+ph-8) {
      labels+='<circle class="sl2z-point" cx="'+f(X(sx[0]))+'" cy="'+f(Y(sx[1]))+'" r="4"/>';
      if (!same(selected,I) && selGeo.ymax*scale>40) labels+='<text x="'+f(X(sx[0])+9)+'" y="'+f(Y(sx[1])-9)+'">'+short(selected)+'</text>';
    }
    if (camera.ymin<1 && ymax>1 && xmin<0 && xmin+camera.span>0) {
      labels+='<circle cx="'+f(X(0))+'" cy="'+f(Y(1))+'" r="2.2" fill="var(--viz-series-2)"/>';
      labels+='<text x="'+f(X(0)+7)+'" y="'+f(Y(1)-7)+'">i</text>';
    }
    let step=camera.span>8?2:camera.span>3.5?1:camera.span>1.5?.5:camera.span>.6?.2:.1;
    if (width<480) step=Math.max(step,camera.span>2.5?1:.5);
    for(let x=Math.ceil(xmin/step)*step;x<xmin+camera.span;x+=step) {
      const xx=X(x);
      if(xx<px+8||xx>px+pw-8)continue;
      ticks+='<path class="sl2z-tick" d="M'+f(xx)+','+f(py+ph)+'v4"/><text x="'+f(xx)+'" y="'+f(py+ph+19)+'" text-anchor="middle">'+f(x)+'</text>';
    }
    const yrange=ymax-camera.ymin,ys=yrange>3?1:yrange>1.2?.5:yrange>.5?.2:yrange>.2?.1:.05;
    for(let y=Math.ceil(camera.ymin/ys)*ys;y<ymax;y+=ys) {
      if (Y(y)<py+14) continue;
      ticks+='<path class="sl2z-tick" d="M'+px+','+f(Y(y))+'h-4"/><text x="'+(px-10)+'" y="'+f(Y(y)+4)+'" text-anchor="end">'+f(y)+'</text>';
    }
    svg.innerHTML='<title>模群基本域在上半平面中的展开</title><desc>每个区域是一个整数行列式为一的矩阵作用于标准基本域的像。深度表示 S、T、T 的逆中的最短字长。</desc>'+
      '<defs><clipPath id="sl2z-clip"><rect x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'"/></clipPath></defs>'+
      '<rect x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'" fill="var(--background)" fill-opacity=".18"/>'+
      '<g clip-path="url(#sl2z-clip)" pointer-events="none"><g class="sl2z-fills">'+shapes+'</g><g class="sl2z-structure">'+lines+'</g>'+
      '<path class="sl2z-standard" d="'+standard+'"/>'+
      (!same(selected,I)?'<path class="sl2z-selection" d="'+selectedPath+'"/>':'')+
      stars+labels+'</g><rect class="sl2z-frame" data-chart-frame x="'+px+'" y="'+py+'" width="'+pw+'" height="'+ph+'"/>'+
      ticks+'<text class="axis-title" data-axis="x" x="'+f(px+pw)+'" y="'+f(height-3)+'" text-anchor="end">Re z</text>'+
      '<text class="axis-title" data-axis="y" x="5" y="12">Im z</text>';
    countLabel.textContent=total.toLocaleString()+" 个区域 · 可见 "+count.toLocaleString();
    depthLabel.textContent=depth;
    details();
    root.dataset.ready="true";
    root.dataset.visible=String(count);
    root.dataset.matrix=key(selected);
    root.dataset.span=String(camera.span);
  }
  function schedule() {
    if (queued) return;
    queued=true;requestAnimationFrame(()=>{queued=false;draw();});
  }
  function zoom(factor,anchor) {
    const k=Math.min(20,Math.max(.16,camera.span*factor))/camera.span;
    camera.center=anchor[0]+(camera.center-anchor[0])*k;
    camera.ymin=Math.max(0,anchor[1]+(camera.ymin-anchor[1])*k);
    camera.span*=k;schedule();
  }
  slider.addEventListener("input",()=>{depth=Number(slider.value);schedule();});
  root.querySelectorAll("[data-generator]").forEach(button=>{
    button.addEventListener("click",()=>{
      const gen=button.dataset.generator==="S"?S:button.dataset.generator==="T"?T:Ti;
      selected=mul(gen,selected);
      const z=act(selected,[0,1.7]);
      if(z[0]<xmin+.1*camera.span||z[0]>xmin+.9*camera.span)camera.center=z[0];
      if(z[1]>ymax)camera.ymin=Math.max(0,z[1]-.5*(ymax-camera.ymin));
      schedule();
    });
  });
  root.querySelector("#sl2z-in").addEventListener("click",()=>zoom(.62,act(selected,[0,1.7])));
  root.querySelector("#sl2z-out").addEventListener("click",()=>zoom(1.6,[camera.center,camera.ymin+.45*(ymax-camera.ymin)]));
  const location = event => {
    const r=svg.getBoundingClientRect();
    return [(event.clientX-r.left)*width/r.width,(event.clientY-r.top)*height/r.height];
  };
  const fromPixels = p => [xmin+(p[0]-px)/scale,camera.ymin+(py+ph-p[1])/scale];
  const pointers=new Map();let gesture=null,moved=false,start=null;
  svg.addEventListener("pointerdown",event=>{
    const p=location(event);
    if(p[0]<px||p[0]>px+pw||p[1]<py||p[1]>py+ph)return;
    svg.setPointerCapture(event.pointerId);pointers.set(event.pointerId,p);
    moved=false;
    if(pointers.size===1)start={p:p.slice(),center:camera.center,ymin:camera.ymin,scale};
    if(pointers.size===2){
      const [a,b]=Array.from(pointers.values()),mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      gesture={distance:Math.hypot(a[0]-b[0],a[1]-b[1]),span:camera.span,anchor:fromPixels(mid)};
      moved=true;
    }
  });
  svg.addEventListener("pointermove",event=>{
    if(!pointers.has(event.pointerId))return;
    const p=location(event);pointers.set(event.pointerId,p);
    if(pointers.size===2&&gesture){
      const [a,b]=Array.from(pointers.values()),mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const newSpan=Math.max(.16,Math.min(20,gesture.span*gesture.distance/Math.max(1,Math.hypot(a[0]-b[0],a[1]-b[1]))));
      const ss=pw/newSpan;
      camera.span=newSpan;
      camera.center=gesture.anchor[0]-(mid[0]-px-pw/2)/ss;
      camera.ymin=Math.max(0,gesture.anchor[1]-(py+ph-mid[1])/ss);
      moved=true;schedule();
    }else if(start){
      const dx=p[0]-start.p[0],dy=p[1]-start.p[1];
      if(Math.hypot(dx,dy)>5)moved=true;
      if(moved){camera.center=start.center-dx/start.scale;camera.ymin=Math.max(0,start.ymin+dy/start.scale);schedule();}
    }
  });
  svg.addEventListener("pointerup",event=>{
    if(!pointers.has(event.pointerId))return;
    const p=location(event);
    if(!moved&&pointers.size===1){
      const z=fromPixels(p);
      if(z[1]>1e-8){selected=reduce(z);schedule();}
    }
    pointers.delete(event.pointerId);gesture=null;start=null;
    moved=true;
  });
  svg.addEventListener("pointercancel",event=>{pointers.delete(event.pointerId);gesture=null;start=null;});
  svg.addEventListener("wheel",event=>{
    const p=location(event);
    if(p[0]<px||p[0]>px+pw||p[1]<py||p[1]>py+ph)return;
    event.preventDefault();zoom(event.deltaY>0?1.13:.885,fromPixels(p));
  },{passive:false});
  new ResizeObserver(schedule).observe(host);
  draw();
})();
</script>
